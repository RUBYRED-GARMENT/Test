<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050A;--sf:#180D14;--sf2:#22121C;--bd:rgba(212,175,106,.18);--tx:#F7F0E8;--mu:#9C8A85;--ru:#C0002A;--ru2:#7A0020;--go:#D4AF6A;--em:#1FBE72;--am:#E6B528;--ease:cubic-bezier(.16,1,.3,1)}
[data-theme=light]{--bg:#FAF6F1;--sf:#fff;--sf2:#F3EBE3;--bd:rgba(122,0,32,.16);--tx:#2A1218;--mu:#7A6A66;--go:#9A7424}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;background-image:radial-gradient(ellipse 70% 40% at 15% -10%,rgba(192,0,42,.2),transparent 65%),radial-gradient(ellipse 50% 40% at 100% 90%,rgba(212,175,106,.1),transparent 60%);background-attachment:fixed}
[hidden]{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:12px}.logo svg{width:36px;height:36px}
.logo b{font-family:'Playfair Display',serif;font-size:1.35rem;letter-spacing:.08em;color:var(--go)}
.logo small{display:block;font-size:.6rem;letter-spacing:.24em;color:var(--mu)}

.ib{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:100px;padding:6px 14px;cursor:pointer;font:600 .75rem Cairo;transition:.25s}
.ib:hover{border-color:var(--ru);color:var(--ru)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:22px}
.auth{display:flex;justify-content:center;padding:48px 16px}.auth .card{width:100%;max-width:420px;padding:36px 32px}
.tabs{display:flex;border:1px solid var(--bd);border-radius:6px;margin-bottom:24px;overflow:hidden}
.tabs button,.nav button{flex:1;padding:11px;background:transparent;border:0;color:var(--mu);cursor:pointer;font:700 .85rem Cairo;transition:.3s}
.tabs button.on,.nav button.on{background:linear-gradient(135deg,var(--ru),var(--ru2));color:#fff}
h1,h2{font-family:'Playfair Display',serif}h2{font-size:1.4rem;margin-bottom:4px}
.sub{color:var(--mu);font-size:.8rem;margin-bottom:18px}
.f{margin-bottom:15px}.f label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--go);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font:.92rem Cairo;outline:0;transition:.25s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ru);box-shadow:0 0 0 3px rgba(192,0,42,.15)}
.f textarea{min-height:80px;resize:vertical}.f input[readonly]{opacity:.6}
.pw{position:relative}.pw button{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:1rem}
.btn{width:100%;padding:13px;border:0;border-radius:6px;cursor:pointer;color:#fff;font:700 .92rem Cairo;background:linear-gradient(135deg,var(--ru),var(--ru2));transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(192,0,42,.4)}.btn:disabled{opacity:.5;transform:none;box-shadow:none;cursor:not-allowed}
.btn.sm{width:auto;padding:9px 20px}
.al{padding:11px 14px;border-radius:6px;margin-bottom:14px;font-size:.82rem;border-inline-start:3px solid var(--ru);background:rgba(192,0,42,.1);color:#FF8A9A}
.al.ok{border-color:var(--em);background:rgba(31,190,114,.1);color:var(--em)}
.dash{max-width:1000px;margin:0 auto;padding:28px 20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.nm{color:var(--go)}.top p{color:var(--mu);font-size:.82rem}
.nav{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:24px}
h3{font-size:.72rem;letter-spacing:.2em;color:var(--go);margin:26px 0 14px;display:flex;align-items:center;gap:10px}h3:after{content:'';flex:1;height:1px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.dc{position:relative;padding:18px 20px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;border-inline-start:3px solid var(--ru);animation:up .4s var(--ease) both}
.dc .l{font-size:.64rem;letter-spacing:.14em;color:var(--mu);margin-bottom:6px}.dc .v{font-weight:600;word-break:break-word}
.bal .big{font-size:2rem;font-weight:800;font-family:'Playfair Display',serif;color:var(--go)}
.bar{height:6px;background:var(--sf2);border-radius:4px;margin:10px 0 6px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.bar .u{background:var(--ru)}.bar .p{background:var(--am)}.bal small{color:var(--mu);font-size:.72rem}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bar2{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:5px 13px;border-radius:100px;border:1px solid var(--bd);background:none;color:var(--mu);cursor:pointer;font:600 .74rem Cairo}
.chip.on{background:var(--ru);border-color:var(--ru);color:#fff}
.hi{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px 20px;margin-bottom:10px;border-inline-start:3px solid var(--am);animation:up .4s var(--ease) both}
.hi.approved{border-inline-start-color:var(--em)}.hi.rejected{border-inline-start-color:var(--ru)}.hi.cancelled{border-inline-start-color:var(--mu);opacity:.7}
.hi b{display:block}.hi small{color:var(--mu);font-size:.76rem;display:block;margin-top:3px}
.st{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pl{padding:4px 11px;border-radius:100px;font-size:.68rem;font-weight:700;border:1px solid}
.pl.pending{color:var(--am);border-color:rgba(230,181,40,.4);background:rgba(230,181,40,.1)}
.pl.approved{color:var(--em);border-color:rgba(31,190,114,.4);background:rgba(31,190,114,.1)}
.pl.rejected{color:#FF6B84;border-color:rgba(192,0,42,.4);background:rgba(192,0,42,.1)}
.pl.wait,.pl.cancelled{color:var(--mu);border-color:var(--bd)}
.x{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:6px;padding:4px 10px;cursor:pointer;font:600 .7rem Cairo}.x:hover{color:var(--ru);border-color:var(--ru)}
.empty{text-align:center;color:var(--mu);padding:30px;font-size:.85rem}
.ov{position:fixed;inset:0;background:rgba(7,5,10,.85);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:.3s}
.ov.open{opacity:1;pointer-events:all}
.md{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:26px;transform:translateY(30px);transition:.4s var(--ease)}.ov.open .md{transform:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.hint{font-size:.78rem;color:var(--go);margin:-6px 0 14px;min-height:1.1em}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;width:92%;max-width:360px}
.ts{background:var(--sf);border:1px solid var(--bd);border-inline-start:3px solid var(--em);padding:12px 16px;border-radius:6px;font-size:.84rem;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:up .3s var(--ease)}.ts.er{border-inline-start-color:var(--ru)}
.att{text-align:center;max-width:440px;margin:0 auto 10px}.clock{font:800 2.4rem 'Playfair Display',serif;color:var(--go)}
.pbtn{width:168px;height:168px;border-radius:50%;border:0;color:#fff;cursor:pointer;font:800 1.05rem Cairo;margin:14px 0;background:linear-gradient(135deg,var(--ru),var(--ru2));box-shadow:0 0 0 8px rgba(192,0,42,.12),0 16px 40px rgba(192,0,42,.4);transition:.25s}

@media(max-width:600px){header{padding:12px 16px}.g2{grid-template-columns:1fr}.auth .card{padding:26px 20px}}

</style>
</head>

  <div class="nav"><button class="on" data-tab="ov" data-i="nOv"></button><button data-tab="at" data-i="nAt"></button><button data-tab="lv" data-i="nLv"></button><button data-tab="ac" data-i="nAc"></button></div>

  <section id="tab-ov">

  </section>

      <button class="pbtn" id="punch"></button><p class="hint" id="attMsg" style="margin:10px 0 0;color:#FF8A9A"></p>
      <p class="sub" data-i="locNote" style="margin:10px 0 0"></p></div>
    <h3 data-i="monthH"></h3><div class="grid" id="attSum"></div>
    <h3 data-i="logH"></h3><div id="attList"></div>

    <div id="hist"></div>
  </section>

  <section id="tab-ac" hidden>
    <div class="card" style="max-width:440px"><h2 data-i="chPw"></h2><p class="sub" data-i="chPwS"></p>

      <div class="f"><label data-i="confirm"></label><input id="pN2" type="password" autocomplete="new-password"></div>
      <button class="btn" id="bPw" data-i="save"></button></div>
  </section>
</main>

<div class="ov" id="ov"><div class="md">
  <h2 data-i="newReq"></h2><p class="sub" data-i="modalS"></p>
  <div class="al" id="lvErr" hidden></div>
  <div class="f"><label data-i="type"></label><select id="lvType"></select></div>
  <div class="g2">
    <div class="f"><label data-i="start"></label><input type="date" id="lvS"></div>
    <div class="f"><label data-i="end"></label><input type="date" id="lvE"></div>
  </div>

  <div class="f"><label data-i="email"></label><input type="email" id="lvMail" placeholder="name@company.com"></div>
  <div class="f"><label data-i="reason"></label><textarea id="lvReason"></textarea></div>
  <div class="f"><label data-i="attach"></label><input type="file" id="lvFile" accept=".pdf,.jpg,.jpeg,.png,.docx"><div class="hint" style="margin:6px 0 0" data-i="attachHint"></div></div>
  <div class="g2"><button class="ib" id="lvCancel" data-i="close" style="border-radius:6px"></button><button class="btn" id="lvSend" data-i="submit"></button></div>
</div></div>
<footer>© 2026 RUBYRED</footer>

 submit:"Submit", close:"Close", days:"day(s)", all:"All", f_pending:"Pending", f_approved:"Approved", f_rejected:"Rejected", f_cancelled:"Cancelled", export:"Export CSV",

};
const t = k => (T[lang] && T[lang][k]) || T.en[k] || k;

// ── API ──
async function api(p) {
  const u = new URL(API);
  Object.entries({ lang, token, ...p }).forEach(([k, v]) => { if (v !== undefined && v !== null) u.searchParams.set(k, v); });
  const r = await (await fetch(u)).json();
  if (r.sessionExpired) { logout(true); throw new Error("expired"); }
  return r;
}
function toast(msg, er) {
  const e = document.createElement("div"); e.className = "ts" + (er ? " er" : ""); e.textContent = msg;
  $("toasts").appendChild(e); setTimeout(() => e.remove(), 3600);
}
function box(id, msg, ok) { const e = $(id); e.textContent = msg; e.className = "al" + (ok ? " ok" : ""); e.hidden = !msg; }

// ── Language / theme ──
function setLang(l) {
  lang = l; document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  $("langBtn").textContent = l === "ar" ? "EN" : "AR"; document.title = t("title");
  fillTypes();
  try { localStorage.setItem("rr_l", l); } catch (e) {}
  if (token) renderAll();
}
$("langBtn").onclick = () => setLang(lang === "ar" ? "en" : "ar");
$("themeBtn").onclick = () => {
  const d = document.documentElement, n = d.dataset.theme === "dark" ? "light" : "dark"; d.dataset.theme = n;
  try { localStorage.setItem("rr_th", n); } catch (e) {}
};
try { const th = localStorage.getItem("rr_th"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
document.querySelectorAll("[data-eye]").forEach(b => b.onclick = () => { const i = $(b.dataset.eye); i.type = i.type === "password" ? "text" : "password"; });

// ── Auth ──
function tab(login) { $("fL").hidden = !login; $("fR").hidden = login; $("tL").classList.toggle("on", login); $("tR").classList.toggle("on", !login); box("aErr", ""); }
$("tL").onclick = () => tab(true); $("tR").onclick = () => tab(false);

async function run(btn, fn) { btn.disabled = true; try { await fn(); } catch (e) { if (e.message !== "expired") throw e; } finally { btn.disabled = false; } }

$("bL").onclick = () => run($("bL"), async () => {
  const code = $("lC").value.trim(), password = $("lP").value;
  if (!code || !password) return box("aErr", t("fill"));
  try {
    const r = await api({ action: "login", code, password });
    if (!r.success) return box("aErr", r.message);
    token = r.token; try { sessionStorage.setItem("rr_t", token); } catch (e) {}
    $("lP").value = ""; enter();
  } catch (e) { if (e.message !== "expired") box("aErr", t("conn")); }
});
$("bR").onclick = () => run($("bR"), async () => {
  const code = $("rC").value.trim(), password = $("rP").value;
  if (!code || !password) return box("aErr", t("fill"));
  if (password !== $("rP2").value) return box("aErr", t("mismatch"));
  if (password.length < 6) return box("aErr", t("short"));
  try {
    const r = await api({ action: "register", code, password });
    if (!r.success) return box("aErr", r.message);
    tab(true); box("aErr", t("registered"), true); $("lC").value = code;
  } catch (e) { box("aErr", t("conn")); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && !token && e.target.tagName === "INPUT") ($("fL").hidden ? $("bR") : $("bL")).click();
});

function enter() {
  $("auth").hidden = true; $("dash").hidden = false; showTab("ov"); loadAll(); loadAtt(); startClock(); startPoll(); resetIdle();
}
async function logout(expired) {
  if (token && !expired) { try { await api({ action: "logout" }); } catch (e) {} }
  token = null; emp = {}; bal = {}; hist = []; att = null; clearInterval(poll); clearInterval(clk); clearTimeout(idle);
  try { sessionStorage.removeItem("rr_t"); } catch (e) {}
  $("dash").hidden = true; $("auth").hidden = false; closeModal();
  if (expired) toast(t("expired"), true);
}
$("bOut").onclick = () => logout(false);
function resetIdle() { clearTimeout(idle); if (token) idle = setTimeout(() => logout(true), IDLE); }
["click", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, resetIdle, { passive: true }));

// ── Data ──
async function loadAll() {
  try {
    const [e, b, h] = await Promise.all([api({ action: "getEmployeeData" }), api({ action: "getLeaveBalance" }), api({ action: "getLeaveHistory" })]);
    if (e.success) emp = e.data; if (b.success) bal = b.data; if (h.success) hist = h.data;
    renderAll();
  } catch (e) { if (e.message !== "expired") toast(t("conn"), true); }
}
async function refresh() {
  if (!token || document.hidden) return;
  try {
    const [b, h] = await Promise.all([api({ action: "getLeaveBalance" }), api({ action: "getLeaveHistory" })]);
    if (b.success) bal = b.data; if (h.success) hist = h.data; renderBal(); renderHist();
  } catch (e) {}
}
function startPoll() { clearInterval(poll); poll = setInterval(refresh, POLL); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

// ── Render ──
function renderAll() { renderHello(); renderBal(); renderCards(); renderChips(); renderHist(); renderAtt(); }
function renderHello() {
  const name = Object.values(emp)[1] || "";
  $("hello").innerHTML = t("hello") + ' <span class="nm">' + esc(name) + "</span>";
  $("date").textContent = new Date().toLocaleDateString(lang === "ar" ? "ar-EG" : "en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}
function renderCards() {
  const en = Object.entries(emp).slice(1);
  $("cards").innerHTML = en.map(([k, v], i) => `<div class="dc" style="animation-delay:${i * 40}ms"><div class="l">${esc(k)}</div><div class="v">${esc(v === "" ? "—" : v)}</div></div>`).join("");
}
function renderBal() {
  $("bal").innerHTML = Object.keys(bal).map(k => {
    const b = bal[k], up = b.quota ? Math.min(100, b.used / b.quota * 100) : 0, pp = b.quota ? Math.min(100 - up, b.pending / b.quota * 100) : 0;
    return `<div class="dc bal"><div class="l">${esc(t(k))}</div><div class="big">${b.remaining}</div><small>${t("remaining")} · ${t("of")} ${b.quota}</small>
      <div class="bar"><i class="u" style="width:${up}%"></i><i class="p" style="width:${pp}%"></i></div><small>${t("used")}: ${b.used} · ${t("pending")}: ${b.pending}</small></div>`;
  }).join("");
}
function stage(s) {
  s = String(s || "").toLowerCase();
  if (s.includes("cancel")) return { o: "cancelled" };
  const ap = s.includes("approved");
  if (s.includes("by hr")) return { m: "approved", h: ap ? "approved" : "rejected", o: ap ? "approved" : "rejected" };
  if (s.includes("by manager")) return ap ? { m: "approved", h: "pending", o: "pending" } : { m: "rejected", h: "wait", o: "rejected" };
  return { m: "pending", h: "wait", o: "pending" };
}
function renderChips() {
  $("chips").innerHTML = ["all", "pending", "approved", "rejected", "cancelled"].map(f => `<button class="chip${filter === f ? " on" : ""}" data-f="${f}">${t(f === "all" ? "all" : "f_" + f)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(c => c.onclick = () => { filter = c.dataset.f; renderChips(); renderHist(); });
}
function renderHist() {
  const rows = hist.slice().reverse().filter(r => filter === "all" || stage(r.status).o === filter);
  if (!rows.length) { $("hist").innerHTML = `<div class="empty">${t("none")}</div>`; return; }
  $("hist").innerHTML = rows.map((r, i) => {
    const s = stage(r.status), pill = (st, who) => `<span class="pl ${st}">${t(who)}: ${t("s_" + st)}</span>`;
    const stat = s.o === "cancelled" ? `<span class="pl cancelled">${t("s_cancelled")}</span>` : pill(s.m, "mgr") + "›" + pill(s.h, "hr");
    return `<div class="hi ${s.o}" style="animation-delay:${Math.min(i, 8) * 40}ms"><div><b>${esc(t(r.leaveType) || r.leaveType)}</b>
      <small>${esc(r.startDate)} → ${esc(r.endDate)} · ${r.days || 0} ${t("days")}</small>
      ${r.reason ? `<small>${esc(r.reason)}</small>` : ""}${r.attachmentName ? `<small>📎 ${esc(r.attachmentName)}</small>` : ""}</div>
      <div class="st">${stat}${r.status === "Pending" ? `<button class="x" data-c="${r.id}">${t("cancel")}</button>` : ""}</div></div>`;
  }).join("");
  $("hist").querySelectorAll("[data-c]").forEach(b => b.onclick = async () => {
    if (!confirm(t("askCancel"))) return;
    try { const r = await api({ action: "cancelLeave", row: b.dataset.c }); toast(r.message, !r.success); refresh(); } catch (e) {}
  });
}

// ── Tabs ──
function showTab(id) {
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
  ["ov", "at", "lv", "ac"].forEach(x => $("tab-" + x).hidden = x !== id);
}
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

// ── CSV export ──
$("bCsv").onclick = () => {
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const csv = "\uFEFF" + [["Type", "Start", "End", "Days", "Status", "Reason"], ...hist.map(r => [r.leaveType, r.startDate, r.endDate, r.days, r.status, r.reason])].map(r => r.map(q).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "leave-history.csv"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ── Leave modal ──
function fillTypes() {
  const s = $("lvType"), v = s.value;
  s.innerHTML = `<option value="" disabled>—</option>` + TYPES.map(k => `<option value="${k}">${t(k)}</option>`).join(""); s.value = v || "";
}
function openModal() {
  ["lvType", "lvS", "lvE", "lvMail", "lvReason", "lvFile"].forEach(i => $(i).value = ""); box("lvErr", ""); $("lvHint").textContent = "";
  $("ov").classList.add("open"); document.body.style.overflow = "hidden";
}
function closeModal() { $("ov").classList.remove("open"); document.body.style.overflow = ""; }
$("bNew").onclick = openModal; $("lvCancel").onclick = closeModal; $("ov").onclick = e => { if (e.target === $("ov")) closeModal(); };

function hint() {
  const s = $("lvS").value, e = $("lvE").value, ty = $("lvType").value;
  if (!s || !e) return ($("lvHint").textContent = "");
  const d = Math.round((new Date(e) - new Date(s)) / 864e5) + 1;
  if (d < 1) return ($("lvHint").textContent = t("dates"));
  const b = bal[ty]; $("lvHint").textContent = d + " " + t("days") + (b ? ` · ${t("left")}: ${b.remaining}` : "");
}
["lvS", "lvE", "lvType"].forEach(i => $(i).onchange = hint);
$("lvFile").onchange = () => { const f = $("lvFile").files[0]; if (f && f.size > MAX) { box("lvErr", t("fileBig")); $("lvFile").value = ""; } else box("lvErr", ""); };
const b64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = no; r.readAsDataURL(f); });

$("lvSend").onclick = () => run($("lvSend"), async () => {
  const ty = $("lvType").value, s = $("lvS").value, e = $("lvE").value, f = $("lvFile").files[0];
  if (!ty || !s || !e) return box("lvErr", t("fill"));
  if (e < s) return box("lvErr", t("dates"));
  if (f && f.size > MAX) return box("lvErr", t("fileBig"));
  try {
    const r = await api({ action: "submitLeave", leaveType: ty, startDate: s, endDate: e, email: $("lvMail").value.trim(), reason: $("lvReason").value.trim(),
      attachmentName: f ? f.name : "", attachmentData: f ? await b64(f) : "" });
    if (!r.success) return box("lvErr", r.message);
    closeModal(); toast(t("sent")); if (r.balance) bal = r.balance; refresh(); showTab("lv");
  } catch (er) { if (er.message !== "expired") box("lvErr", t("conn")); }
});

// ── Change password ──
$("bPw").onclick = () => run($("bPw"), async () => {
  const o = $("pO").value, n = $("pN").value;
  if (!o || !n) return box("cErr", t("fill"));
  if (n !== $("pN2").value) return box("cErr", t("mismatch"));
  if (n.length < 6) return box("cErr", t("short"));
  try {
    const r = await api({ action: "changePassword", oldPassword: o, newPassword: n });
    box("cErr", r.message, r.success); if (r.success) { ["pO", "pN", "pN2"].forEach(i => $(i).value = ""); toast(t("pwDone")); }
  } catch (er) { if (er.message !== "expired") box("cErr", t("conn")); }
});

// ── Attendance (GPS) ──
let att = null, clk;
const getPos = () => new Promise((ok, no) => {
  if (!navigator.geolocation) return no({ code: -1 });
  navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
});
function startClock() {
  clearInterval(clk);
  const f = () => { $("clock").textContent = new Date().toLocaleTimeString(lang === "ar" ? "ar-EG" : "en-GB"); };
  f(); clk = setInterval(f, 1000);
}
async function loadAtt() {
  try { const r = await api({ action: "getAttendance" }); if (r.success) { att = r.data; renderAtt(); } } catch (e) {}
}
function renderAtt() {
  if (!att) return;
  const td = att.today, b = $("punch"), st = !td ? "in" : (!td.out ? "out" : "done");
  b.dataset.t = st; b.disabled = st === "done";
  b.textContent = t(st === "in" ? "checkIn" : st === "out" ? "checkOut" : "doneToday");
  $("attSt").textContent = td ? t("checkIn") + ": " + td.in + (td.out ? " · " + t("checkOut") + ": " + td.out : "") : t("notYet");
  $("attSum").innerHTML = `<div class="dc"><div class="l">${t("presentDays")}</div><div class="v">${att.presentDays}</div></div><div class="dc"><div class="l">${t("lateMin")}</div><div class="v">${att.lateMin}</div></div><div class="dc"><div class="l">${t("earlyMin")}</div><div class="v">${att.earlyMin}</div></div><div class="dc"><div class="l">${t("overtimeMin")}</div><div class="v">${att.overtimeMin}</div></div>`;
  $("attList").innerHTML = att.month.map(r => `<div class="hi ${r.late ? "" : "approved"}"><div><b>${esc(r.date)}</b><small>${esc(r.in)} → ${esc(r.out || "—")}${r.overtime ? " · " + t("overtime") + " " + r.overtime + "′" : ""}${r.leftEarly ? " · " + t("leftEarly") + " " + r.leftEarly + "′" : ""}</small></div>` +
    (r.late ? `<span class="pl pending">${t("late")} ${r.late}′</span>` : r.early ? `<span class="pl approved">${t("early")} ${r.early}′</span>` : `<span class="pl approved">${t("onTime")}</span>`) + `</div>`).join("") || `<div class="empty">${t("noAtt2")}</div>`;
}
$("punch").onclick = async () => {
  await run($("punch"), async () => {
    const type = $("punch").dataset.t; $("attMsg").textContent = t("locating");
    let p;
    try { p = await getPos(); } catch (e) { $("attMsg").textContent = t(e.code === 1 ? "locDenied" : e.code === -1 ? "locNo" : "locFail"); return; }
    try {
      const r = await api({ action: "punch", type, lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) });
      $("attMsg").textContent = r.success ? "" : r.message + (r.distance ? " (" + r.distance + " m)" : "");
      if (r.success) toast(r.message + " · " + r.time);
      await loadAtt();
    } catch (e) { if (e.message !== "expired") $("attMsg").textContent = t("conn"); }
  });
  renderAtt();
};

// ── Init ──
setLang(lang);
if (token) enter();
</script>
</body>
</html>
